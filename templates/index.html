<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ガジュマルCare</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#557b5d">

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='icon-192.png') }}"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            color: #344239;

            background:
                linear-gradient(
                    135deg,
                    #e8eee5 0%,
                    #f7f5ef 50%,
                    #dfe9dc 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 600px;
        }

        /* ヘッダー */

        header {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 22px;
        }

        h1 {
            margin: 0;

            font-size: 36px;
            font-weight: 600;
            letter-spacing: 1px;

            color: #34483b;
        }

        /* タイトル横のガジュマル */

        .plant-image {
            width: 72px;
            height: 72px;

            object-fit: contain;

            margin-left: 10px;
        }

        /* メインカード */

        .card {
            background: rgba(255, 255, 255, 0.62);

            border: 1px solid rgba(255, 255, 255, 0.75);

            border-radius: 28px;

            padding: 25px 24px;

            text-align: center;

            box-shadow:
                0 12px 40px rgba(60, 80, 65, 0.12);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* 水やり情報 */

        .section {
            padding: 18px 0;
        }

        .section + .section {
            border-top:
                1px solid rgba(80, 100, 85, 0.15);
        }

        .label {
            margin: 0 0 10px;

            font-size: 20px;

            color: #6f786f;
        }

        .date {
            margin: 0;

            font-size: 36px;
            font-weight: 600;

            color: #334438;
        }

        .days-number {
            font-size: 58px;
            font-weight: 600;

            color: #4f755b;
        }

        .days-text {
            margin-left: 6px;

            font-size: 24px;

            color: #536057;
        }

        /* ボタン */

        form {
            margin-top: 24px;
        }

        button {
            width: 100%;

            padding: 17px 20px;

            border: none;
            border-radius: 18px;

            font-size: 21px;
            font-weight: 600;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #89a87e,
                    #557b5d
                );

            box-shadow:
                0 8px 18px rgba(70, 110, 80, 0.22);

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* スマホ向け */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            header {
                margin-bottom: 16px;
            }

            h1 {
                font-size: 32px;
            }

            .plant-image {
                width: 58px;
                height: 58px;
                margin-left: 8px;
            }

            .card {
                padding: 22px 20px;
                border-radius: 26px;
            }

            .section {
                padding: 15px 0;
            }

            .label {
                font-size: 18px;
                margin-bottom: 8px;
            }

            .date {
                font-size: 32px;
            }

            .days-number {
                font-size: 54px;
            }

            .days-text {
                font-size: 22px;
            }

            form {
                margin-top: 20px;
            }

            button {
                padding: 16px;
                font-size: 20px;
                border-radius: 17px;
            }
        }

        /* 画面の高さが小さいスマホ */

        @media (max-height: 700px) {

            header {
                margin-bottom: 10px;
            }

            h1 {
                font-size: 30px;
            }

            .plant-image {
                width: 48px;
                height: 48px;
                margin-left: 6px;
            }

            .card {
                padding: 18px 20px;
            }

            .section {
                padding: 12px 0;
            }

            .date {
                font-size: 30px;
            }

            .days-number {
                font-size: 48px;
            }

            form {
                margin-top: 16px;
            }

            button {
                padding: 14px;
            }
        }

    </style>
</head>

<body>

    <main class="app">

        <header>

            <h1>ガジュマルCare</h1>

            <img
                src="{{ url_for('static', filename='gajumaru.jpg') }}"
                alt="ガジュマル"
                class="plant-image"
            >

        </header>

        <section class="card">

            <div class="section">

                <p class="label">
                    最後の水やり
                </p>

                <p class="date">
                    {{ last_watered }}
                </p>

            </div>

            {% if days_since is not none %}

            <div class="section">

                <p class="label">
                    水やりから
                </p>

                <div>
                    <span class="days-number">
                        {{ days_since }}
                    </span>

                    <span class="days-text">
                        日
                    </span>
                </div>

            </div>

            {% endif %}

            <form action="/water" method="post">

                <button type="submit">
                    水やり完了
                </button>

            </form>

        </section>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register(
                    "{{ url_for('static', filename='service-worker.js') }}"
                );
            });
        }
    </script>
    </main>

</body>
</html>
